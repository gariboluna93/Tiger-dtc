<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tiger DTC</title>
<meta name="theme-color" content="#14171a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una columna tipo tablero TFT; barra de estado fija arriba, acciones, luego modulos */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --fg:#16191c; --mut:#5d646b; --line:#d9ddd8;
  --accent:#0a6e8a; --accent-fg:#ffffff;
  --red:#b3261e; --amber:#9a5b00; --green:#1f6b3d;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101315; --panel:#191d20; --fg:#e8ebe8; --mut:#9aa2a8; --line:#2c3236;
  --accent:#4cc3e0; --accent-fg:#071317; --red:#ff8a80; --amber:#f2b84b; --green:#7fd69b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101315; --panel:#191d20; --fg:#e8ebe8; --mut:#9aa2a8; --line:#2c3236;
  --accent:#4cc3e0; --accent-fg:#071317; --red:#ff8a80; --amber:#f2b84b; --green:#7fd69b; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;border-bottom:1px solid var(--line)}
h1{font:700 26px/1.1 var(--display);letter-spacing:.02em;margin:0;text-transform:uppercase}
h1 small{font:500 13px var(--body);color:var(--mut);text-transform:none;letter-spacing:0;margin-left:6px}
.status{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:500 12px var(--mono);padding:3px 8px;border:1px solid var(--line);border-radius:999px;color:var(--mut);background:var(--panel)}
.chip.on{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,var(--line))}
.chip.bad{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.chip.warn{color:var(--amber)}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:14px 0}
button{font:600 15px var(--body);padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{color:var(--mut);font-size:13px;margin:6px 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;min-width:0}
.mod h2{font:600 19px/1.2 var(--display);letter-spacing:.02em;margin:0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mod h2 code{font:500 12px var(--mono);color:var(--mut)}
.ident{font:12px var(--mono);color:var(--mut);word-break:break-all;margin:4px 0 8px}
.dtc{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:8px 0 8px 10px;border-top:1px solid var(--line);border-left:3px solid var(--amber)}
.dtc.act{border-left-color:var(--red)}
.dtc b{font:600 16px var(--mono)}
.dtc .tag{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--amber);align-self:center}
.dtc.act .tag{color:var(--red)}
.dtc .desc{grid-column:1/-1;font-size:14px}
.dtc .raw{grid-column:1/-1;font:11px var(--mono);color:var(--mut);word-break:break-all}
.ok{color:var(--green);font-weight:600}
details summary{cursor:pointer;color:var(--mut);font-size:13px;margin-top:6px}
details code{font:11px var(--mono);margin-right:6px}
.gauges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.g{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.g .v{font:700 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.g .l{font-size:12px;color:var(--mut)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.confirm input{font:600 15px var(--mono);padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:9em}
.checks{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0}
.checks label{display:flex;gap:6px;align-items:center;font-size:14px}
pre#log{font:11px/1.4 var(--mono);color:var(--mut);max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:0}
.cmp li{margin:2px 0}
@media (prefers-reduced-motion:no-preference){button{transition:filter .15s}button:hover:not(:disabled){filter:brightness(1.06)}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Tiger DTC <small>v3.0 · Tiger 900</small></h1>
  <div class="status">
    <span class="chip" id="stLink">Sin conexion</span>
    <span class="chip" id="stBus">Bus: -</span>
    <span class="chip" id="stVolt">Voltaje: -</span>
  </div>
</header>

<p class="note" id="support"></p>

<div class="actions">
  <button class="primary" id="bConnect">Conectar vLinker</button>
  <button id="bRead" disabled>Leer todos los modulos</button>
  <button id="bLive" disabled>Datos en vivo</button>
  <button id="bExport" disabled>Exportar JSON</button>
</div>

<div id="cmp"></div>
<div id="mods"></div>

<section class="panel" id="livePanel" hidden>
  <h2 style="font:600 19px var(--display);margin:0 0 8px">Datos en vivo · Engine ECM</h2>
  <div class="gauges" id="gauges"></div>
</section>

<section class="panel" id="clearPanel" hidden>
  <h2 style="font:600 19px var(--display);margin:0">Borrar codigos</h2>
  <p class="note">Moto detenida, motor apagado, contacto ON. Se bloquea si el voltaje es menor a 12.0 V. Se guarda un respaldo de la lectura antes de borrar.</p>
  <div class="checks" id="clearChecks"></div>
  <div class="confirm">
    <input id="clearWord" autocomplete="off" placeholder="BORRAR" aria-label="Escribe BORRAR para confirmar">
    <button class="danger" id="bClear" disabled>Borrar seleccionados</button>
  </div>
</section>

<details class="panel"><summary>Registro de comunicacion</summary><pre id="log"></pre></details>
</div>

    try {
      for (let i = 0; i < retries; i++) {
        const lines = await this.cmd(hex(payload).toUpperCase(), timeout);
        const [msgs, partial] = reassemble(parseFrames(lines, true).filter(f => f[0] === rs));
        const out = msgs.get(rs) || [];
        const pend = out.filter(m => m.length >= 3 && m[0] === 0x7F && m[2] === 0x78);
        const fin = out.filter(m => !pend.includes(m));
        if (fin.length || !pend.length) return [fin, partial.has(rs)];
        await this.cmd("ATSTFF"); timeout = Math.max(timeout, 3000);
      }
      return [[], false];
    } finally { await this.cmd("ATST32"); }
  }
}
const reqId = a => (0x18DA00F1 | (a << 8)) >>> 0;
const respId = a => (0x18DAF100 | a) >>> 0;

function parseFrames(lines, ext){
  const n = ext ? 8 : 3, out = [];
  for (let l of lines) { l = l.replace(/ /g,"");
    if (!/^[0-9A-Fa-f]+$/.test(l) || l.length < n+2 || l.length > n+16 || (l.length-n) % 2) continue;
    out.push([parseInt(l.slice(0,n),16) >>> 0, fromHex(l.slice(n))]); }
  return out;
}
function reassemble(frames){
  const msgs = new Map(), part = new Map();
  for (const [id, d] of frames) {
    if (!d.length) continue; const t = d[0] >> 4;
    if (t === 0) { (msgs.get(id) || msgs.set(id, []).get(id)).push(d.slice(1, 1 + (d[0] & 15))); }
    else if (t === 1 && d.length >= 2) part.set(id, {n:((d[0]&15)<<8)|d[1], b:Array.from(d.slice(2)), sn:1});
    else if (t === 2 && part.has(id)) { const p = part.get(id);
      if ((d[0] & 15) !== (p.sn & 15)) { part.delete(id); continue; }
      p.sn++; p.b.push(...d.slice(1));
      if (p.b.length >= p.n) { (msgs.get(id) || msgs.set(id, []).get(id)).push(Uint8Array.from(p.b.slice(0, p.n))); part.delete(id); } }
  }
  return [msgs, part];
}

/* ------------------------------------------------------------------ decodificacion */
const LET = "PCBU";
const dtcStr = (b0,b1) => LET[b0>>6] + ((b0>>4)&3) + (b0&15).toString(16).toUpperCase() + H(b1,2);
const BITS = ["testFailed","testFailedThisCycle","pending","confirmed","notCompletedSinceClear","failedSinceClear","notCompletedThisCycle","MIL"];
const NRC = {0x11:"servicio no soportado",0x12:"subfuncion no soportada",0x13:"longitud incorrecta",0x22:"condiciones no correctas",0x31:"fuera de rango",0x33:"acceso denegado",0x7E:"subfuncion no soportada en esta sesion",0x7F:"servicio no soportado en esta sesion"};
const nrc = m => `NRC 0x${H(m[2],2)} ${NRC[m[2]]||""}`.trim();
function describe(code){ const e = DB[code.slice(0,5)]; if (!e) return "(sin descripcion en la base)";
  return `${e[0]} (${e[1] ? "manual p. "+e[1] : "boletin tecnico Triumph"}; seccion: ${e[2]})`; }
function decode1902(m){
  if (m.length < 3 || m[0] !== 0x59 || m[1] !== 0x02) return null;
  const r = [];
  for (let i = 3; i + 3 < m.length; i += 4) { const [b0,b1,ftb,st] = m.slice(i, i+4);
    if (!b0 && !b1 && !ftb) continue;
    r.push({dtc:`${dtcStr(b0,b1)}-${H(ftb,2)}`, bytes:H(b0,2)+H(b1,2)+H(ftb,2), status:"0x"+H(st,2),
      flags:BITS.filter((_,i)=>st>>i&1).join(","), falla:!!(st&0x2D), activa:!!(st&1)}); }
  return r;
}
const OBD_MODES = {3:"confirmado",7:"pendiente",10:"permanente"};
function decodeObd(m, mode){
  if (m.length < 2 || m[0] !== mode + 0x40) return null;
  const body = m.length % 2 === 0 ? m.slice(2) : m.slice(1), r = [];
  for (let i = 0; i + 1 < body.length; i += 2) if (body[i] || body[i+1])
    r.push({dtc:dtcStr(body[i],body[i+1]), status:OBD_MODES[mode], falla:true, activa:mode===3});
  return r;
}
const PIDS = {0x0C:["RPM","rpm",(a,b)=>Math.round((a*256+b)/4)],0x0D:["Velocidad","km/h",a=>a],0x05:["Refrigerante","°C",a=>a-40],
  0x0F:["Aire admision","°C",a=>a-40],0x11:["Acelerador","%",a=>+(a*100/255).toFixed(1)],0x04:["Carga","%",a=>+(a*100/255).toFixed(1)],
  0x0B:["Presion colector","kPa",a=>a],0x0E:["Avance","°",a=>a/2-64],0x42:["Voltaje modulo","V",(a,b)=>+((a*256+b)/1000).toFixed(2)],
  0x46:["Ambiente","°C",a=>a-40],0x5C:["Aceite","°C",a=>a-40],0x33:["Barometrica","kPa",a=>a]};
const IDS = {0xF190:"VIN",0xF187:"num_parte",0xF18A:"proveedor",0xF18C:"num_serie",0xF191:"hw",0xF193:"version_hw",0xF195:"version_sw",0xF197:"nombre_sistema"};
function text(b){ const t = new TextDecoder("ascii").decode(b).replace(/^[\x00\xff ]+|[\x00\xff ]+$/g,"");
  return t && /^[\x20-\x7e]+$/.test(t) ? t : hex(b); }

/* ------------------------------------------------------------------ lecturas */
async function readModule(elm, mod){
  const a = parseInt(mod.addr,16);
  const r = {addr:mod.addr, nombre:NAMES[mod.addr]||("Modulo "+mod.addr), req:"0x"+H(reqId(a),8), resp:"0x"+H(respId(a),8), obd:!!mod.obd};
  await elm.setExt(true);
  if (mod.obd) {
    let [ms] = await elm.request(a, [0x01,0x01], 2000, 1);
    for (const m of ms) if (m[0]===0x41 && m[1]===0x01) { r.mil = !!(m[2]&0x80); r.dtc_reportados = m[2]&0x7F; }
    const dtcs = []; let got = false;
    for (const mode of [3,7,10]) { [ms] = await elm.request(a, [mode], 2000, 1);
      for (const m of ms) { if (m[0]===0x7F) { (r.negativas ||= []).push(`OBD ${H(mode,2)}: ${nrc(m)}`); continue; }
        const d = decodeObd(m, mode); if (d) { got = true; dtcs.push(...d); } } }
    if (got) { r.servicio = "OBD 03/07/0A"; r.dtc = dtcs; }
  } else {
    for (const [did, key] of Object.entries(IDS)) { const [ms] = await elm.request(a, [0x22, did>>8, did&255], 1000, 1);
      for (const m of ms) if (m.length > 3 && m[0]===0x62 && (m[1]<<8|m[2])==did) (r.ident ||= {})[key] = text(m.slice(3)); }
    for (const mask of [0xFF,0x2D,0x0C,0x04,0x08]) { const [ms] = await elm.request(a, [0x19,0x02,mask]);
      let done = false;
      for (const m of ms) { if (m[0]===0x7F) { (r.negativas ||= []).push(`UDS 19 02 ${H(mask,2)}: ${nrc(m)}`); continue; }
        const d = decode1902(m); if (d) { r.servicio = "UDS 19 02 "+H(mask,2); r.dtc = d; r.raw = hex(m); done = true; } }
      if (done) break; }
    for (const d of (r.dtc||[]).filter(x => x.falla)) {
      const dtc3 = Array.from(fromHex(d.bytes));
      for (const [key, sub] of [["snapshot",4],["datos_ext",6]]) { const [ms] = await elm.request(a, [0x19, sub, ...dtc3, 0xFF], 2000, 1);
        for (const m of ms) { if (m[0]===0x59 && m.length > 6) { d[key] = hex(m.slice(6));
            if (sub===6 && m[6]===0x01 && m.length > 7) d.ocurrencias_posible = m[7]; }
          else if (m[0]===0x7F) d[key] = nrc(m); } } }
  }
  for (const d of (r.dtc||[])) d.descripcion = describe(d.dtc);
  return r;
}
async function supportedPids(elm, a){
  const s = new Set();
  for (let base = 0; base <= 0x40; base += 0x20) { const [ms] = await elm.request(a, [0x01, base], 2000, 1);
    const m = ms.find(x => x.length >= 6 && x[0]===0x41 && x[1]===base); if (!m) break;
    const v = ((m[2]<<24)|(m[3]<<16)|(m[4]<<8)|m[5]) >>> 0;
    for (let i = 0; i < 32; i++) if ((v >>> (31-i)) & 1) s.add(base+i+1);
    if (!(v & 1)) break; }
  return s;
}

/* ------------------------------------------------------------------ comparacion */
const faults = m => Object.fromEntries((m.dtc||[]).filter(d => d.falla).map(d => [d.dtc, d]));
function compare(results, base){
  const key = m => m.addr || H(parseInt(m.resp,16) & 255, 2);
  const old = Object.fromEntries((base.modulos||[]).map(m => [key(m), faults(m.despues_de_borrar || m)]));
  return results.map(m => { const n = faults(m), p = old[m.addr] || {};
    return {nombre:m.nombre, nuevas:Object.keys(n).filter(k=>!(k in p)), resueltas:Object.keys(p).filter(k=>!(k in n)), persisten:Object.keys(n).filter(k=>k in p)}; });
}

/* ------------------------------------------------------------------ interfaz */
let link = null, elm = null, last = null, busy = false, liveOn = false;
function setBusy(b){ busy = b; for (const id of ["bRead","bLive","bExport"]) $(id).disabled = b || !elm || (id==="bExport" && !last);
  $("bConnect").disabled = b; updateClearBtn(); }

function renderModule(r){
  const f = (r.dtc||[]).filter(d => d.falla), o = (r.dtc||[]).filter(d => !d.falla);
  let h = `<section class="panel mod"><h2>${esc(r.nombre)} <code>0x${esc(r.addr)}</code></h2>`;
  if (r.ident) h += `<div class="ident">${Object.entries(r.ident).map(([k,v]) => `${esc(k)}: ${esc(v)}`).join(" · ")}</div>`;
  if ("mil" in r) h += `<p>MIL <b>${r.mil ? "ENCENDIDA" : "apagada"}</b> · DTC reportados: ${r.dtc_reportados}</p>`;
  if (r.dtc) {
    if (!f.length) h += `<p class="ok">Sin fallas registradas</p>`;
    for (const d of f) h += `<div class="dtc ${d.activa ? "act" : ""}"><b>${esc(d.dtc)}</b><span class="tag">${d.activa ? "Activa" : "Registrada"} · ${esc(d.status)}</span>
      <div class="desc">${esc(d.descripcion)}</div>
      ${d.ocurrencias_posible != null ? `<div class="raw">ocurrencias (posible): ${d.ocurrencias_posible}</div>` : ""}
      ${d.snapshot ? `<div class="raw">snapshot: ${esc(d.snapshot)}</div>` : ""}${d.datos_ext ? `<div class="raw">datos ext: ${esc(d.datos_ext)}</div>` : ""}</div>`;
    if (o.length) h += `<details><summary>${o.length} codigos listados sin falla (prueba no completada)</summary>${o.map(d => `<code>${esc(d.dtc)}</code>`).join("")}</details>`;
  } else h += `<p class="note">No respondio a lectura de DTC ${esc((r.negativas||[]).join("; "))}</p>`;
  if (r.borrado) h += `<p><b>Borrado:</b> ${esc(r.borrado)}</p>`;
  return h + `</section>`;
}
function render(){
  $("mods").innerHTML = last ? last.modulos.map(renderModule).join("") : "";
  const cmp = last && last.comparacion;
  $("cmp").innerHTML = cmp ? `<section class="panel"><h2 style="font:600 19px var(--display);margin:0">Contra la ultima lectura limpia</h2><ul class="cmp">${
    cmp.map(c => `<li><b>${esc(c.nombre)}</b>: nuevas ${esc(c.nuevas.join(", ")||"-")} · resueltas ${esc(c.resueltas.join(", ")||"-")}</li>`).join("")}</ul></section>` : "";
  const withF = last ? last.modulos.filter(m => !m.obd && m.dtc) : [];
  $("clearPanel").hidden = !withF.length;
  $("clearChecks").innerHTML = withF.map(m => `<label><input type="checkbox" id="clr_${m.addr}" ${(m.dtc||[]).some(d=>d.falla) ? "checked" : ""}> ${esc(m.nombre)}</label>`).join("");
  updateClearBtn();
}
function updateClearBtn(){ $("bClear").disabled = busy || !elm || $("clearWord").value.trim() !== "BORRAR"; }
$("clearWord").addEventListener("input", updateClearBtn);

async function guarded(fn){
  if (busy) return; setBusy(true);
  try { await fn(); }
  catch (e) {
    if (String(e.message) === "LINK") { log("Enlace perdido; reconectando..."); chip("stLink","Reconectando","warn");
      try { await link.open(); elm = new Elm(link); await elm.init(); log("Reconectado. Repite la accion."); } catch (e2) { log("No se pudo reconectar: " + e2.message); } }
    else { log("Error: " + e.message); alertNote(e.message); }
  } finally { setBusy(false); }
}
function alertNote(t){ $("support").textContent = t; }

$("bConnect").onclick = () => guarded(async () => {
  link = link || new Link(); await link.open(); elm = new Elm(link); await elm.init();
  const v = await elm.voltage(); chip("stVolt", v != null ? `${v.toFixed(1)} V` : "Voltaje: ?", v != null && v < MIN_VOLT ? "bad" : "on");
  alertNote(v != null && v < MIN_VOLT ? "Voltaje bajo: la lectura puede mostrar codigos falsos y el borrado esta bloqueado." : "Conectado. No se transmite nada en 11 bit.");
});
$("bRead").onclick = () => guarded(async () => {
  const prof = store.get("tiger_profile") || DEFAULT_PROFILE;
  last = {version:"3.0", fecha:new Date().toISOString(), voltaje:await elm.voltage(), modulos:[]};
  for (const m of prof) { alertNote(`Leyendo ${NAMES[m.addr]||m.addr}...`); last.modulos.push(await readModule(elm, m)); render(); }
  const base = store.get("tiger_baseline"); if (base) last.comparacion = compare(last.modulos, base);
  const clean = last.modulos.every(m => !(m.dtc||[]).some(d => d.falla));
  if (clean) store.set("tiger_baseline", last);
  alertNote(clean ? "Lectura limpia: guardada como linea base para comparar la proxima vez." : "Lectura terminada.");
  render();
});
$("bLive").onclick = async () => {
  if (liveOn) { liveOn = false; $("bLive").textContent = "Datos en vivo"; return; }
  if (busy) return; setBusy(true); liveOn = true; $("bLive").disabled = false; $("bLive").textContent = "Detener datos en vivo";
  try {
    await elm.setExt(true); const a = 0xD6; const sup = await supportedPids(elm, a);
    const pids = [0x0C,0x0D,0x05,0x0F,0x11,0x04,0x0B,0x0E,0x42,0x46,0x5C,0x33].filter(p => sup.has(p));
    $("livePanel").hidden = false;
    $("gauges").innerHTML = pids.map(p => `<div class="g"><div class="v" id="pv${p}">-</div><div class="l">${PIDS[p][0]} (${PIDS[p][1]})</div></div>`).join("");
    while (liveOn) { for (const p of pids) { if (!liveOn) break; const [ms] = await elm.request(a, [0x01, p], 1000, 1);
        const m = ms.find(x => x.length >= 3 && x[0]===0x41 && x[1]===p); if (m) $("pv"+p).textContent = PIDS[p][2](m[2], m[3]||0); } }
  } catch (e) { log("Datos en vivo: " + e.message); }
  finally { liveOn = false; $("bLive").textContent = "Datos en vivo"; setBusy(false); }
};
$("bExport").onclick = () => { if (!last) return;
  const blob = new Blob([JSON.stringify(last, null, 2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `dtc_${last.fecha.replace(/[-:T]/g,"").slice(0,14)}.json`; a.click(); };
$("bClear").onclick = () => guarded(async () => {
  const v = await elm.voltage(); chip("stVolt", v != null ? `${v.toFixed(1)} V` : "?", v != null && v >= MIN_VOLT ? "on" : "bad");
  if (v == null || v < MIN_VOLT) { alertNote(`Borrado cancelado: voltaje ${v ?? "?"} V (minimo ${MIN_VOLT} V).`); return; }
  store.set("tiger_respaldo_" + Date.now(), last);
  for (const m of last.modulos) { const cb = $("clr_"+m.addr); if (!cb || !cb.checked) continue;
    await elm.setExt(true); const a = parseInt(m.addr,16); const [ms] = await elm.request(a, [0x14,0xFF,0xFF,0xFF], 3000);
    let out = "sin respuesta"; for (const x of ms) { if (x[0]===0x54) out = "BORRADO OK"; else if (x[0]===0x7F) out = "rechazado " + nrc(x); }
    m.borrado = out;
    if (out === "BORRADO OK") { await sleep(1000); const n = await readModule(elm, m); m.despues_de_borrar = n; m.dtc = n.dtc; }
    render(); }
  $("clearWord").value = ""; alertNote("Borrado terminado. Rueda la moto y vuelve a leer para ver si algo reaparece.");
});

if (!("bluetooth" in navigator)) alertNote("Este navegador no tiene Web Bluetooth. Usa Chrome en Android y abre la pagina desde una direccion https.");
else if (!window.isSecureContext) alertNote("Web Bluetooth requiere abrir esta pagina desde https.");
else alertNote("Moto detenida, contacto ON, motor apagado. Pulsa Conectar y elige el vLinker de la lista.");
</script>
</body>
</html>
